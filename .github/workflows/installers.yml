name: Installer fixtures

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  posix:
    name: POSIX fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Shell syntax and offline fixtures
        run: |
          sh -n install.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_install_sh.py' -v
  windows:
    name: Windows fixtures
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 offline fixtures
        shell: powershell
        run: ./tests/test_install_ps1.ps1
      - name: PowerShell 7 offline fixtures
        shell: pwsh
        run: ./tests/test_install_ps1.ps1
